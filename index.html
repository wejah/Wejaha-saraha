<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111014">
<title>گيم وحل فشي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    min-height:100svh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    background:
      radial-gradient(130% 100% at 50% 40%, #1a1920 0%, #111014 60%, #0c0b0f 100%);
    overflow:hidden;
  }

  h1{
    font-family:"Noto Naskh Arabic", serif;
    font-weight:600;
    font-size:clamp(1.9rem, 11vw, 5.5rem);
    line-height:1;
    white-space:nowrap;
    color:#efe9df;
    letter-spacing:.01em;
    text-align:center;
    text-shadow:0 1px 30px rgba(0,0,0,.5);
    animation:fade 1.1s cubic-bezier(.2,.7,.2,1) both;
  }

  @keyframes fade{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    h1{ animation:none; }
  }
</style>
</head>
<body>
  <h1>گيم وحل فشي</h1>
</body>
</html>
